<style>
@font-face{font-family:"Big Shoulders Stencil Display"; font-style:normal; font-weight:700; font-display:swap; src:url("fonts/big-shoulders-stencil-700.woff") format("woff")}
@font-face{font-family:"Big Shoulders Stencil Display"; font-style:normal; font-weight:800; font-display:swap; src:url("fonts/big-shoulders-stencil-800.woff") format("woff")}
@font-face{font-family:"Caveat"; font-style:normal; font-weight:400; font-display:swap; src:url("fonts/caveat-400.woff") format("woff")}
@font-face{font-family:"Caveat"; font-style:normal; font-weight:700; font-display:swap; src:url("fonts/caveat-700.woff") format("woff")}
@font-face{font-family:"Special Elite"; font-style:normal; font-weight:400; font-display:swap; src:url("fonts/special-elite-400.woff") format("woff")}
:root{
  color-scheme: light;
  --wood:#93613a; --wood-2:#7e522f; --wood-3:#a6714a; --lamp:rgba(255,232,180,.30);
  --on-desk:#fbf1dc; --on-desk-2:#f0dfbd;
  --paper:#efe5cb; --paper-2:#e4d6b4; --ink:#2a2418; --ink-2:#5d533f;
  --rule:rgba(70,100,150,.26); --margin:rgba(185,55,45,.5);
  --map:#e8dab5; --map-ink:#7a6542; --map-water:#b7c9cc;
  --red:#a3322a; --olive:#4b5320; --olive-hi:#5d6728; --brass:#b08d3e;
  --leather:#5b3a22; --leather-2:#46301c; --shadow:rgba(35,18,6,.38);
  --glass:#141711; --glass-ink:#efe6c8; --felt:#24452f; --frame:#5e3b20;
  --f-stencil:"Big Shoulders Stencil Display","Impact","Arial Narrow",sans-serif;
  --f-type:"Special Elite","Courier New",Courier,monospace;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --wood:#2e1c11; --wood-2:#24150c; --wood-3:#3a2416; --lamp:rgba(255,205,130,.17);
    --on-desk:#eadfc4; --on-desk-2:#cdbf9f;
    --paper:#d8ccae; --paper-2:#cbbd9b; --ink:#221d13; --ink-2:#4e4534;
    --rule:rgba(60,85,125,.28); --margin:rgba(165,45,38,.5);
    --map:#cdbf97; --map-ink:#5f4f33; --map-water:#93a6a8;
    --red:#a8352c; --olive:#434a1d; --olive-hi:#535c24; --brass:#a88637;
    --leather:#3c2615; --leather-2:#2d1c0f; --shadow:rgba(0,0,0,.62);
    --glass:#0f110c; --glass-ink:#efe6c8; --felt:#1a3123; --frame:#3e2614;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --wood:#2e1c11; --wood-2:#24150c; --wood-3:#3a2416; --lamp:rgba(255,205,130,.17);
  --on-desk:#eadfc4; --on-desk-2:#cdbf9f;
  --paper:#d8ccae; --paper-2:#cbbd9b; --ink:#221d13; --ink-2:#4e4534;
  --rule:rgba(60,85,125,.28); --margin:rgba(165,45,38,.5);
  --map:#cdbf97; --map-ink:#5f4f33; --map-water:#93a6a8;
  --red:#a8352c; --olive:#434a1d; --olive-hi:#535c24; --brass:#a88637;
  --leather:#3c2615; --leather-2:#2d1c0f; --shadow:rgba(0,0,0,.62);
  --glass:#0f110c; --glass-ink:#efe6c8; --felt:#1a3123; --frame:#3e2614;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); overflow-x:hidden}
body{
  margin:0; min-height:100vh; overflow-x:clip; color:var(--on-desk); font-family:var(--f-type); font-size:16px; line-height:1.45;
  background-color:var(--wood);
  background-image:
    radial-gradient(ellipse 70% 55% at 28% 18%, var(--lamp), transparent 70%),
    radial-gradient(ellipse 120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.35)),
    repeating-linear-gradient(92deg, transparent 0 22px, rgba(0,0,0,.05) 22px 24px, transparent 24px 61px, rgba(255,255,255,.035) 61px 63px, transparent 63px 97px),
    repeating-linear-gradient(88deg, var(--wood) 0 180px, var(--wood-2) 180px 186px, var(--wood-3) 186px 260px, var(--wood) 260px 420px);
  background-attachment:fixed;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Placa de latón */
.desk-top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px 20px; padding:20px clamp(16px,4vw,44px) 4px; max-width:1640px; margin:0 auto}
.plate{
  position:relative; z-index:6; display:inline-block; padding:9px 26px 8px;
  background:linear-gradient(180deg,#e2c77d,#b7963f 55%,#9c7c2e); color:#2a2010;
  border-radius:3px; box-shadow:inset 0 1px rgba(255,255,255,.55), inset 0 -2px 3px rgba(0,0,0,.25), 0 6px 12px var(--shadow);
}
.plate::before,.plate::after{content:""; position:absolute; top:50%; width:7px; height:7px; margin-top:-3.5px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#f4e2a8,#7a5d1f 70%)}
.plate::before{left:9px} .plate::after{right:9px}
.plate h1{margin:0; font-family:var(--f-stencil); font-weight:800; font-size:clamp(24px,3.2vw,34px); line-height:1; letter-spacing:.02em; text-shadow:0 1px 0 rgba(255,255,255,.45)}
.plate p{margin:2px 0 0; font-size:12px; text-align:center}
.lang{display:flex; gap:8px; position:relative; z-index:6}
.tools{display:flex; align-items:center; gap:14px; position:relative; z-index:6}
.snd{position:relative; border:0; cursor:pointer; padding:5px 10px 5px 22px; background:var(--paper); color:var(--ink); border-radius:2px 8px 8px 2px; box-shadow:0 3px 6px var(--shadow); transform:rotate(-3deg); display:inline-flex; align-items:center}
.snd::before{content:""; position:absolute; left:7px; top:50%; width:7px; height:7px; margin-top:-3.5px; border-radius:50%; background:var(--wood-2); box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.snd svg{width:20px; height:20px; display:block}
.snd .waves{transition:opacity .2s}
.snd[aria-pressed="false"] .waves{opacity:0}
.snd[aria-pressed="true"] .mute{opacity:0}
.lang button{
  position:relative; border:0; cursor:pointer; padding:6px 14px 6px 22px; font-size:14px;
  background:var(--paper); color:var(--ink); border-radius:2px 8px 8px 2px; box-shadow:0 3px 6px var(--shadow);
  transform:rotate(-2deg);
}
.lang button:nth-child(2){transform:rotate(2.5deg)}
.lang button::before{content:""; position:absolute; left:7px; top:50%; width:7px; height:7px; margin-top:-3.5px; border-radius:50%; background:var(--wood-2); box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.lang button[aria-selected="true"]{background:var(--olive); color:var(--on-desk)}

/* Mesa */
.desk{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr); gap:clamp(34px,calc(8vw - 60px),110px); padding:18px clamp(16px,4vw,44px) 48px; max-width:1640px; margin:0 auto; align-items:start}
@media (max-width:920px){ .desk{grid-template-columns:minmax(0,1fr)} }

.theatre{display:flex; flex-direction:column; align-items:center; gap:16px; min-width:0}
.field{position:relative; width:100%; display:grid; place-items:center; padding:clamp(56px,8vw,84px) 4% clamp(34px,5vw,52px)}
.map{position:absolute; left:-12%; top:-14%; width:128%; height:124%; transform:translate(15%,-13%) rotate(-6deg); filter:drop-shadow(0 10px 16px var(--shadow)); z-index:0}

.theatre{position:relative}
.knife{position:absolute; z-index:1; left:-27%; top:28%; width:min(580px,88%); transform:rotate(74deg); transform-origin:30% 50%; pointer-events:none; filter:drop-shadow(5px 9px 6px var(--shadow)) drop-shadow(1px 2px 1px rgba(0,0,0,.35))}
.pistol{position:absolute; z-index:1; right:-36%; bottom:-144px; width:min(500px,80%); transform:rotate(56deg) scaleX(-1); pointer-events:none; filter:drop-shadow(-8px 13px 9px var(--shadow)) drop-shadow(-1px 2px 1px rgba(0,0,0,.4))}
@media (max-width:560px){ .knife{left:-32%; width:96%} .pistol{right:-42%; width:92%; bottom:-128px} }
.rounds{position:absolute; z-index:1; right:7%; bottom:-154px; width:min(250px,40%); pointer-events:none; filter:drop-shadow(3px 5px 3px var(--shadow)) drop-shadow(0 1px 1px rgba(0,0,0,.35))}
@media (max-width:560px){ .rounds{right:-10%; width:46%; bottom:-150px} }
/* Vitrina de condecoraciones */
.medals{max-width:1640px; margin:0 auto; padding:10px clamp(16px,4vw,44px) 64px}
.medal-board{
  position:relative; padding:20px 22px 24px; border-radius:4px; color:#e6dcc0;
  background-color:var(--felt);
  background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.3px), radial-gradient(rgba(0,0,0,.2) 1px, transparent 1.4px), radial-gradient(ellipse at 50% 0%, rgba(255,240,200,.08), transparent 60%);
  background-size:4px 4px, 7px 7px, 100% 100%;
  box-shadow:0 0 0 12px var(--frame), 0 0 0 13px rgba(0,0,0,.45), inset 0 0 34px rgba(0,0,0,.55), 0 20px 34px 12px var(--shadow);
}
@media (min-width:921px){
  .medals,.site-foot{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr); column-gap:clamp(34px,calc(8vw - 60px),110px)}
  .medal-board,.site-foot>*{grid-column:1}
}
@media (min-width:1200px) and (max-width:1500px){ .medal-board .slots{grid-template-columns:repeat(6,minmax(0,1fr)); gap:18px 8px} }
@media (max-width:920px){ .medal-board{max-width:760px; margin:0 auto} }
.medal-head{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 20px}
.medal-head .plate{padding:7px 22px 6px}
.medal-head .plate h2{margin:0; font-family:var(--f-stencil); font-weight:800; font-size:24px; line-height:1; letter-spacing:.03em; text-shadow:0 1px 0 rgba(255,255,255,.45)}
.medal-head span{font-size:13px; color:#cdd5b4}
.slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:20px 12px; margin-top:20px}
.slot{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; padding:6px 4px 8px; border-radius:3px; background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,.22), transparent 70%)}
.slot svg{display:block; width:86px; height:146px; filter:drop-shadow(2px 6px 4px rgba(0,0,0,.6))}
.slot:not(.won) svg{filter:grayscale(1) brightness(.55) contrast(.85); opacity:.32}
.sl-name{font-size:11px; line-height:1.2; min-height:2.4em; color:#e6dcc0}
.sl-prog{font-size:11px; line-height:1.25; color:#a9b78d}
.slot.won .sl-prog{color:#e3c46f}
@media (max-width:560px){ .medal-board{padding:16px 12px 20px} .slots{grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px 6px} .slot svg{width:70px; height:119px} .sl-name,.sl-prog{font-size:10px} }
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:30; transform:translate(-50%,16px); opacity:0; pointer-events:none;
  max-width:min(92vw,560px); padding:12px 18px; background:var(--paper); color:var(--ink); border:2px solid var(--brass); border-radius:3px;
  font-family:var(--f-type); font-size:14px; box-shadow:0 12px 26px var(--shadow); transition:opacity .3s ease, transform .3s ease}
.toast.show{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
.foot-btns{display:flex; flex-wrap:wrap; gap:8px}
.foot-btns .btn{font-size:12.5px; padding:5px 9px}
.site-foot{max-width:1640px; margin:-28px auto 0; padding:0 clamp(16px,4vw,44px) 40px; color:var(--on-desk-2); font-size:12px; line-height:1.5; text-shadow:0 1px 2px rgba(0,0,0,.5)}
.site-foot p{margin:4px 0; max-width:90ch}
.modal{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:20px; background:rgba(10,6,2,.62)}
.modal[hidden]{display:none}
.modal-card{width:min(520px,100%); background:var(--paper); color:var(--ink); padding:22px 22px 18px; border-top:3px solid var(--brass); box-shadow:0 18px 40px rgba(0,0,0,.55); transform:rotate(-.6deg)}
.modal-card h2{margin:0 0 6px; font-family:var(--f-stencil); font-weight:800; font-size:24px; letter-spacing:.02em}
.modal-card p{margin:0 0 10px; font-size:14px}
.modal-card textarea{width:100%; resize:vertical; padding:9px 10px; border:1.5px solid var(--ink-2); border-radius:2px; background:var(--paper-2); color:var(--ink); font:13px/1.4 var(--f-type); word-break:break-all}
.code-msg{min-height:1.3em; font-size:13px; color:var(--olive)}
.code-msg.bad{color:var(--red)}
/* Chapa identificativa */
.dogtag-wrap{position:absolute; left:0; top:4px; z-index:4; width:156px; transform:rotate(-13deg); transform-origin:20% 0}
.chain-layer{position:absolute; left:0; top:0; width:0; height:0; overflow:visible; pointer-events:none}
#chainUnder{z-index:1} #chainBack{z-index:3} #chainFront{z-index:5}
.dogtag .hole{position:absolute; left:17px; top:50%; width:0; height:0}
.dogtag{
  position:relative; margin-top:22px; width:156px; padding:12px 12px 10px 34px; border-radius:18px/22px;
  background:linear-gradient(140deg,#e4e4dc,#a7a8a0 38%,#d5d6ce 58%,#8d8e86);
  color:#40413b; font-size:12px; line-height:1.3; letter-spacing:.04em;
  text-shadow:0 1px 0 rgba(255,255,255,.7), 0 -1px 0 rgba(0,0,0,.35);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.22), 0 7px 12px var(--shadow);
}
.dogtag::before{content:""; position:absolute; left:11px; top:50%; width:12px; height:12px; margin-top:-6px; border-radius:50%; background:radial-gradient(circle at 40% 40%,#2a2a26,#5f605a); box-shadow:inset 0 2px 3px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.6)}
.dogtag span{display:block; white-space:nowrap}
.dogtag .big{font-size:18px; letter-spacing:.06em}

/* Brújula */
.compass{position:relative; z-index:2; width:min(500px,88%); aspect-ratio:1/1}
.bail{position:absolute; left:50%; top:-10.5%; width:15%; aspect-ratio:1/1; transform:translateX(-50%); border-radius:50%; border:clamp(5px,1.5vw,9px) solid #a5853a; box-shadow:inset 0 1px 2px rgba(0,0,0,.5), 0 3px 5px var(--shadow); z-index:0}
.hinge{position:absolute; left:50%; top:-3%; width:24%; height:6%; transform:translateX(-50%); border-radius:5px; background:linear-gradient(180deg,#e0c477,#8d6f27); box-shadow:0 3px 6px var(--shadow); z-index:0}
.compass canvas{position:relative; z-index:1; display:block; width:100%; height:100%; border-radius:50%; box-shadow:0 18px 30px var(--shadow), 0 4px 8px rgba(0,0,0,.35)}
.lubber{position:absolute; z-index:3; left:50%; top:.6%; width:7%; height:6.1%; transform:translateX(-50%); pointer-events:none; filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.glass{position:absolute; z-index:2; inset:23.6%; border-radius:50%; pointer-events:none; background:radial-gradient(ellipse 60% 45% at 32% 24%, rgba(255,255,255,.17), transparent 70%)}
.readout{position:absolute; z-index:3; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 27%; pointer-events:none; color:var(--glass-ink)}
.ro-dlc{display:none}
.ro-title{font-family:var(--f-stencil); font-weight:800; font-size:clamp(21px,4.2vw,34px); line-height:1.02; overflow-wrap:anywhere; text-shadow:0 0 12px rgba(0,0,0,.6)}
.ro-title.mid{font-size:clamp(17px,3.3vw,27px)}
.ro-title.long{font-size:clamp(14px,2.6vw,21px)}
.ro-title.done{color:#b9d47a}
.ro-title.idle{font-family:var(--f-type); font-weight:400; font-size:clamp(12px,2vw,15px); line-height:1.35; color:rgba(239,230,200,.8)}
.ro-state{margin-top:8px; font-size:11px; min-height:1.3em; color:#b9d47a}

/* Botón de chapa verde oliva */
.spin{
  position:relative; z-index:2; font-family:var(--f-stencil); font-weight:800; font-size:25px; letter-spacing:.04em;
  padding:12px 40px 11px; border:0; border-radius:4px; cursor:pointer; color:var(--on-desk);
  background:linear-gradient(180deg,var(--olive-hi),var(--olive));
  box-shadow:inset 0 1px rgba(255,255,255,.2), inset 0 -2px 3px rgba(0,0,0,.35), 0 4px 0 #262b10, 0 10px 18px var(--shadow);
}
.spin::before,.spin::after{content:""; position:absolute; top:50%; width:6px; height:6px; margin-top:-3px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#9aa067,#22270c 75%)}
.spin::before{left:12px} .spin::after{right:12px}
.spin:active{transform:translateY(3px); box-shadow:inset 0 1px rgba(255,255,255,.15), inset 0 -2px 3px rgba(0,0,0,.35), 0 1px 0 #262b10, 0 5px 10px var(--shadow)}
.spin:disabled{opacity:.6; cursor:default; transform:none}
.pool{position:relative; z-index:2; margin:0; color:var(--on-desk-2); font-size:13px; text-align:center; max-width:48ch; text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* Orden de operaciones */
.orders{
  position:relative; width:min(590px,100%); margin-top:8px; padding:26px 26px 20px; transform:rotate(.7deg);
  background:var(--paper); color:var(--ink);
  background-image:linear-gradient(180deg, rgba(255,255,255,.18), transparent 30%), radial-gradient(ellipse at 85% 90%, rgba(120,90,40,.12), transparent 50%);
  box-shadow:0 12px 22px var(--shadow), 0 1px 2px rgba(0,0,0,.25);
}
.orders[hidden]{display:none}
.clip{position:absolute; top:-22px; left:21px; width:32px; height:84px; overflow:visible; pointer-events:none; transform:rotate(7deg); transform-origin:50% 26%}
.o-head{display:flex; justify-content:space-between; gap:12px; font-size:13px; color:var(--ink-2); border-bottom:1.5px solid var(--ink-2); padding-bottom:6px; margin-bottom:12px; padding-left:22px}
.o-dlc{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2)}
.sw{display:inline-block; width:10px; height:10px; border-radius:50%; flex:none; box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.orders h2{margin:6px 0 10px; font-family:var(--f-type); font-weight:400; font-size:clamp(22px,3.2vw,29px); line-height:1.15; padding-right:110px}
.orders p{margin:0 0 18px; font-size:15.5px; max-width:60ch}
.stamp{
  position:absolute; top:44px; right:18px; transform:rotate(-9deg);
  border:3px double var(--red); color:var(--red); border-radius:3px; padding:2px 10px;
  font-family:var(--f-stencil); font-weight:800; font-size:18px; letter-spacing:.06em; opacity:.85; mix-blend-mode:multiply;
}
.stamp.ok{border-color:var(--olive); color:var(--olive)}
.actions{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.btn{border:1.5px solid var(--ink-2); background:transparent; color:var(--ink); padding:7px 13px; border-radius:2px; font-family:var(--f-type); font-size:14px; cursor:pointer; text-decoration:none; display:inline-block}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--olive); border-color:var(--olive); color:var(--on-desk)}
.btn.primary:hover{background:var(--olive-hi)}
.btn.primary.undo{background:transparent; color:var(--olive); border-color:var(--olive)}
.link{color:var(--ink-2); font-size:14px; text-decoration:underline; text-underline-offset:3px}
.link:hover{color:var(--ink)}

/* Cuaderno */
.notebook{
  justify-self:end; width:100%; max-width:600px;
  position:relative; z-index:2; padding:28px 13px 13px; border-radius:7px; transform:rotate(1.1deg);
  background:var(--leather);
  background-image:radial-gradient(rgba(255,255,255,.04) 1px, transparent 1.4px), linear-gradient(160deg, rgba(255,255,255,.06), transparent 40%, rgba(0,0,0,.2));
  background-size:5px 5px, 100% 100%;
  box-shadow:0 18px 34px var(--shadow), inset 0 0 0 1px rgba(0,0,0,.4);
}

.page{
  display:flex; flex-direction:column; min-height:0; color:var(--ink); background:var(--paper); border-radius:2px;

}

.filters{display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin-top:6px}
.filters input{grid-column:1 / -1}
.filters input,.filters select{width:100%; padding:5px 2px; border:0; border-bottom:1.5px solid var(--ink-2); background:transparent; font-family:var(--f-type); font-size:14px; border-radius:0}
.filters select{cursor:pointer}
.filters select option{background:var(--paper); color:var(--ink)}
.filters input::placeholder{color:var(--ink-2); opacity:.8}
details.dlcs{margin-top:10px}
details.dlcs summary{cursor:pointer; font-family:var(--f-hand); font-weight:700; font-size:21px; list-style:none; display:flex; gap:8px; align-items:center}
details.dlcs summary::-webkit-details-marker{display:none}
details.dlcs summary::before{content:"+"; font-family:var(--f-type); font-size:15px; color:var(--red); width:12px}
details.dlcs[open] summary::before{content:"–"}
.chips{display:flex; flex-wrap:wrap; gap:6px; padding:6px 0 4px}
.chip{display:inline-flex; align-items:center; gap:6px; border:1px dashed var(--ink-2); background:transparent; border-radius:2px; padding:3px 8px; font-family:var(--f-type); font-size:12px; cursor:pointer; color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--paper-2); color:var(--ink); border-style:solid}
.chip[aria-pressed="false"] .sw{opacity:.25}
.chip[aria-pressed="false"] span:nth-child(2){text-decoration:line-through}
.chip small{font-size:11px; opacity:.75}
.chip-tools{display:flex; gap:14px; padding:2px 0 2px}

#list{
  list-style:none; margin:0; padding:4px 0 10px; flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  background-color:var(--paper);

  background-attachment:local;
  scrollbar-width:thin; scrollbar-color:var(--ink-2) transparent;
}
#list::-webkit-scrollbar{width:9px}
#list::-webkit-scrollbar-thumb{background:var(--ink-2); border-radius:5px; border:2px solid var(--paper)}
#list label{display:grid; grid-template-columns:22px 1fr; column-gap:24px; padding:8px 16px 10px 14px; cursor:pointer}
#list label:hover{background:rgba(120,90,40,.07)}
.chk{-webkit-appearance:none; appearance:none; position:relative; width:20px; height:20px; margin:6px 0 0; border:1.6px solid var(--ink-2); border-radius:3px 1px 4px 2px; background:transparent; cursor:pointer}
.chk:checked::after{content:""; position:absolute; left:4px; top:-4px; width:8px; height:16px; border:solid var(--red); border-width:0 3px 3px 0; transform:rotate(40deg)}
.li-title{font-family:var(--f-hand); font-weight:700; font-size:25px; line-height:1.05}
.li-meta{grid-column:2; display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-2); margin-top:2px}
.li-desc{grid-column:2; font-family:var(--f-hand); font-size:20px; line-height:1.12; color:var(--ink-2)}
#list li.is-done .li-title{color:var(--ink-2)}
#list li.is-done .tt{background-image:linear-gradient(var(--red),var(--red)); background-repeat:no-repeat; background-position:0 60%; background-size:100% 2.2px; -webkit-box-decoration-break:clone; box-decoration-break:clone}
#list li.strike-anim{animation:rowflash 1.8s ease-out}
#list li.strike-anim .tt{animation:strike .75s .35s cubic-bezier(.3,.7,.4,1) both}
#list li.strike-anim .chk:checked::after{animation:tick .3s ease-out both}
@keyframes strike{from{background-size:0% 2.2px} to{background-size:100% 2.2px}}
@keyframes rowflash{0%{background:transparent} 18%{background:rgba(214,170,60,.3)} 100%{background:transparent}}
@keyframes tick{from{transform:rotate(40deg) scale(0); opacity:0} to{transform:rotate(40deg) scale(1); opacity:1}}
@media (prefers-reduced-motion: reduce){ #list li.strike-anim, #list li.strike-anim .tt, #list li.strike-anim .chk:checked::after{animation:none} }
.empty{padding:22px 18px 22px 62px; font-family:var(--f-hand); font-size:21px; color:var(--ink-2)}
.page-foot{padding:10px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; border-top:2px solid var(--rule)}
.page-foot p{margin:0; font-size:11.5px; color:var(--ink-2); max-width:42ch}
.btn.danger{color:var(--red); border-color:var(--red); font-size:12.5px; padding:5px 9px}

function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

/* ---------- Efectos de sonido (sintetizados con Web Audio, sin archivos externos) ---------- */
const SND = (()=>{
  let ctx = null, master = null, on = store.get("hoi4r.sound", true) !== false, lastTick = 0;
  function ac(){
    if(!on) return null;
    if(!ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; ctx = new C(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function env(g, t, a, d, v){ g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+a); g.gain.exponentialRampToValueAtTime(.0001, t+a+d); }
  function tone(f, dur, type, vol, when, f2, filt){
    const c = ac(); if(!c) return; const t = c.currentTime + (when||0);
    const o = c.createOscillator(), g = c.createGain(); o.type = type||"sine"; o.frequency.setValueAtTime(f, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
    let node = o;
    if(filt){ const bq = c.createBiquadFilter(); bq.type = "lowpass"; bq.frequency.value = filt; o.connect(bq); node = bq; }
    node.connect(g); g.connect(master); env(g, t, .006, dur, vol); o.start(t); o.stop(t+dur+.05);
  }
  function noise(dur, vol, when, type, freq, q){
    const c = ac(); if(!c) return; const t = c.currentTime + (when||0);
    const len = Math.max(1, Math.floor(c.sampleRate*dur)), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const s = c.createBufferSource(); s.buffer = buf;
    const bq = c.createBiquadFilter(); bq.type = type||"bandpass"; bq.frequency.value = freq||1000; bq.Q.value = q||1;
    const g = c.createGain(); s.connect(bq); bq.connect(g); g.connect(master); env(g, t, .004, dur, vol); s.start(t); s.stop(t+dur+.05);
    return g;
  }
  return {
    get on(){ return on; },
    set(v){ on = !!v; store.set("hoi4r.sound", on); if(!on && ctx) ctx.suspend(); },
    click(){ noise(.03,.35,0,"highpass",2200,.7); tone(1400,.03,"square",.05); },
    tick(){ const n = performance.now(); if(n-lastTick < 38) return; lastTick = n; noise(.018,.28,0,"bandpass",3200,3); tone(2100,.012,"square",.03); },
    windup(){ for(let i=0;i<5;i++) noise(.025,.22,i*.045,"bandpass",1800+i*250,4); },
    thunk(){ tone(150,.22,"sine",.5,0,70); noise(.09,.35,0,"lowpass",500,.7); noise(.03,.25,.01,"bandpass",2600,5); },
    stamp(){ noise(.11,.6,0,"lowpass",420,.8); tone(95,.16,"sine",.45,0,55); noise(.05,.18,.02,"bandpass",1500,2); },
    scratch(when){ const w = when||0; for(let i=0;i<7;i++) noise(.09,.13+.03*(i%2),w+i*.1,"bandpass",3200+(i%3)*500,2.2); },
    unmark(){ noise(.25,.12,0,"bandpass",900,1.4); },
    medal(when){ const w = when||0, notes = [392,523.3,659.3,784];
      notes.forEach((f,i)=>{ tone(f,.22,"sawtooth",.13,w+i*.13,null,1800); tone(f*2,.22,"triangle",.04,w+i*.13); });
      [523.3,659.3,784,1046.5].forEach(f=> tone(f,.9,"sawtooth",.09,w+.55,null,2200));
      noise(.6,.05,w+.55,"highpass",6000,.5); }
  };
})();

let pool = [];
let rot = 0, spinning = false, current = null;
function rebuildPool(){ pool = SHUFFLED.filter(a=>!done.has(a.t) && enabled.has(a.k)); }

/* ---------- Brújula (canvas) ---------- */
const cv = $("#dial"), ctx = cv.getContext("2d");
let S = 0, dpr = 1, glass = "#141711";
const STENCIL = '"Big Shoulders Stencil Display", Impact, sans-serif';
function readTheme(){ glass = getComputedStyle(document.documentElement).getPropertyValue("--glass").trim() || "#141711"; }
function resize(){
  const r = cv.getBoundingClientRect();
  if(!r.width) return;
  dpr = Math.min(window.devicePixelRatio||1, 2);
  S = r.width;
  cv.width = Math.round(S*dpr); cv.height = Math.round(S*dpr);
  draw();
}
function indexAt(){
  const n = pool.length; if(!n) return -1;
  const a = TAU/n; const x = ((-rot)%TAU + TAU)%TAU;
  return Math.min(n-1, Math.floor(x/a));
}
function ring(c,r1,r2){ ctx.beginPath(); ctx.arc(c,c,r1,0,TAU); ctx.arc(c,c,r2,0,TAU,true); }
function draw(){
  if(!S) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,S,S);
  const c = S/2, R = c-1;
  const rb = R*0.9, rbi = R*0.755, ro = R*0.742, ri = R*0.53;

  // Caja de latón
  const g = ctx.createRadialGradient(c-R*.35, c-R*.42, R*.05, c, c, R);
  g.addColorStop(0,"#f4dc92"); g.addColorStop(.42,"#b9933f"); g.addColorStop(.82,"#7a5d21"); g.addColorStop(1,"#4a3711");
  ctx.beginPath(); ctx.arc(c,c,R,0,TAU); ctx.fillStyle = g; ctx.fill();
  // Moleteado
  ctx.strokeStyle = "rgba(38,26,6,.5)"; ctx.lineWidth = 1;
  for(let i=0;i<180;i++){ const a = i*TAU/180; ctx.beginPath(); ctx.moveTo(c+(R-.5)*Math.cos(a), c+(R-.5)*Math.sin(a)); ctx.lineTo(c+(R-R*.035)*Math.cos(a), c+(R-R*.035)*Math.sin(a)); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(c,c,R*.955,0,TAU); ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(255,240,190,.45)"; ctx.stroke();

  // Bisel pavonado
  ctx.beginPath(); ctx.arc(c,c,rb,0,TAU); ctx.fillStyle = "#1c1b15"; ctx.fill();
  ctx.beginPath(); ctx.arc(c,c,rb,0,TAU); ctx.lineWidth = 2; ctx.strokeStyle = "#5b4516"; ctx.stroke();
  ctx.strokeStyle = "rgba(232,222,190,.82)";
  for(let d=0; d<360; d+=5){
    const a = (d-90)*Math.PI/180;
    const L = d%30===0 ? R*.04 : (d%10===0 ? R*.028 : R*.017);
    ctx.lineWidth = d%30===0 ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(c+(rb-2)*Math.cos(a), c+(rb-2)*Math.sin(a)); ctx.lineTo(c+(rb-2-L)*Math.cos(a), c+(rb-2-L)*Math.sin(a)); ctx.stroke();
  }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const cards = tr().card;
  for(let d=0; d<360; d+=30){
    const a = (d-90)*Math.PI/180, rr = rbi + R*.042;
    ctx.save(); ctx.translate(c+rr*Math.cos(a), c+rr*Math.sin(a)); ctx.rotate(a+Math.PI/2);
    if(d%90===0){ ctx.font = `800 ${R*.078}px ${STENCIL}`; ctx.fillStyle = d===0 ? "#d24a3c" : "#efe6c8"; ctx.fillText(cards[d/90],0,0); }
    else { ctx.font = `700 ${R*.045}px ${STENCIL}`; ctx.fillStyle = "rgba(232,222,190,.78)"; ctx.fillText(String(d),0,0); }
    ctx.restore();
  }

  // Rosa giratoria con los logros
  const n = pool.length;
  ctx.beginPath(); ctx.arc(c,c,ro+1.5,0,TAU); ctx.fillStyle = "#0e0e0a"; ctx.fill();
  if(n===0){
    ring(c,ro,ri); ctx.fillStyle = "#3a3a30"; ctx.fill("evenodd");
  }else{
    const a = TAU/n, sel = indexAt();
    for(let i=0;i<n;i++){
      const s = -Math.PI/2 + rot + i*a, e = s + a + (n>1 ? .002 : 0);
      ctx.beginPath(); ctx.arc(c,c,ro,s,e); ctx.arc(c,c,ri,e,s,true); ctx.closePath();
      ctx.fillStyle = DLC[pool[i].k].c; ctx.globalAlpha = (i===sel) ? 1 : .78; ctx.fill();
    }
    ctx.globalAlpha = 1;
    if(n>1 && n<=160){
      ctx.strokeStyle = "rgba(14,13,9,.55)"; ctx.lineWidth = n>80 ? .6 : 1.2;
      for(let i=0;i<n;i++){ const s = -Math.PI/2 + rot + i*a; ctx.beginPath(); ctx.moveTo(c+ri*Math.cos(s), c+ri*Math.sin(s)); ctx.lineTo(c+ro*Math.cos(s), c+ro*Math.sin(s)); ctx.stroke(); }
    }
    const sh = ctx.createRadialGradient(c,c,ri,c,c,ro);
    sh.addColorStop(0,"rgba(0,0,0,.4)"); sh.addColorStop(.28,"rgba(0,0,0,0)"); sh.addColorStop(.82,"rgba(0,0,0,0)"); sh.addColorStop(1,"rgba(0,0,0,.35)");
    ring(c,ro,ri); ctx.fillStyle = sh; ctx.fill("evenodd");
    if(sel>=0){
      const s = -Math.PI/2 + rot + sel*a;
      ctx.beginPath(); ctx.arc(c,c,ro-1,s,s+a); ctx.arc(c,c,ri+1,s+a,s,true); ctx.closePath();
      ctx.lineWidth = 2; ctx.strokeStyle = "#f3dc92"; ctx.stroke();
    }
  }

  // Cristal central con la rosa de los vientos
  const gl = ctx.createRadialGradient(c,c-ri*.2,ri*.1,c,c,ri);
  gl.addColorStop(0,"#22261c"); gl.addColorStop(1,glass);
  ctx.beginPath(); ctx.arc(c,c,ri-2,0,TAU); ctx.fillStyle = gl; ctx.fill();
  ctx.save(); ctx.translate(c,c); ctx.rotate(rot);
  for(let k=0;k<8;k++){
    const len = k%2===0 ? ri*.84 : ri*.52, w = k%2===0 ? ri*.085 : ri*.06;
    ctx.save(); ctx.rotate(k*TAU/8);
    ctx.beginPath(); ctx.moveTo(0,-len); ctx.lineTo(w,0); ctx.lineTo(0,w*.6); ctx.lineTo(-w,0); ctx.closePath();
    ctx.fillStyle = k===0 ? "rgba(210,74,60,.32)" : "rgba(239,230,200,.07)"; ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(239,230,200,.07)"; ctx.lineWidth = 1;
  [0.9,0.62].forEach(f=>{ ctx.beginPath(); ctx.arc(c,c,(ri-2)*f,0,TAU); ctx.stroke(); });
  ctx.beginPath(); ctx.arc(c,c,ri-2,0,TAU); ctx.lineWidth = 3; ctx.strokeStyle = "#a88637"; ctx.stroke();
  ctx.beginPath(); ctx.arc(c,c,ri-4.5,0,TAU); ctx.lineWidth = 1; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.stroke();
}

const roDlc = $("#roDlc"), roTitle = $("#roTitle"), roState = $("#roState");
function setReadout(a, mode){
  roTitle.className = "ro-title";
  if(!a){
    roDlc.textContent = "";
    roTitle.textContent = pool.length ? tr().idle : tr().empty;
    roTitle.classList.add("idle");
    roState.textContent = "";
    return;
  }
  roDlc.textContent = dlcName(a.k);
  roTitle.textContent = a.t;
  const L = a.t.length;
  if(L>46) roTitle.classList.add("long"); else if(L>26) roTitle.classList.add("mid");

}

/* ---------- Giro ---------- */
const spinBtn = $("#spinBtn");
function spin(){
  if(spinning || !pool.length) return;
  const n = pool.length, a = TAU/n;
  const t = Math.floor(Math.random()*n);
  const jitter = (Math.random()-.5)*0.6*a;
  const target = -((t+0.5)*a + jitter);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const turns = reduce ? 1 : 6 + Math.floor(Math.random()*3);
  const delta = ((target-rot)%TAU + TAU)%TAU;
  const r0 = rot, r1 = rot + turns*TAU + delta;
  const dur = reduce ? 700 : 5400 + Math.random()*800;
  const t0 = performance.now();
  spinning = true; updateSpinBtn(); SND.windup();
  $("#result").setAttribute("aria-busy","true");
  let last = -1;
  function frame(now){
    const p = Math.min(1,(now-t0)/dur);
    const e = 1 - Math.pow(1-p,4);
    rot = r0 + (r1-r0)*e;
    draw();
    const i = indexAt();
    if(i!==last){ last = i; if(pool[i]) setReadout(pool[i],"spin"); if(p < .985) SND.tick(); }
    if(p<1){ requestAnimationFrame(frame); return; }
    rot = r1 % TAU;
    spinning = false;
    current = pool[indexAt()] || null;
    draw(); setReadout(current,"result"); showResult(); updateSpinBtn(); SND.thunk();
    $("#result").removeAttribute("aria-busy");
    if(window.innerWidth < 920){ $("#result").scrollIntoView({block:"nearest", behavior: reduce ? "auto" : "smooth"}); }
  }
  requestAnimationFrame(frame);
}
function updateSpinBtn(){
  spinBtn.textContent = spinning ? tr().spinning : tr().spin;
  spinBtn.disabled = spinning || !pool.length;
}

function wikiUrl(t){ return "https://hoi4.paradoxwikis.com/Achievements#" + encodeURIComponent(t.replace(/’/g,"'").replace(/ /g,"_")); }
const pad3 = n => String(n).padStart(3,"0");
function showResult(){
  const card = $("#result");
  if(!current){ card.hidden = true; return; }

  card.hidden = false;
  $("#oHead").textContent = tr().oHead;

/* ---------- Condecoraciones: una medalla por bloque completado (dibujos fieles a las reales) ---------- */
const f1 = n => (+n).toFixed(1);
function polyStar(cx,cy,n,r1,r2,rot){
  let d = "";
  for(let i=0;i<n*2;i++){ const r = i%2 ? r2 : r1, a = (rot||0) + i*Math.PI/n; d += (i?"L":"M") + f1(cx+r*Math.sin(a)) + " " + f1(cy-r*Math.cos(a)); }
  return d + "Z";
}
// Brazo hacia arriba (coordenadas locales, centro en 0,0) según el tipo de cruz
const ARM = {
  pattee:(r)=>`M${f1(-r*.17)} 0L${f1(-r*.5)} ${f1(-r)}L${f1(r*.5)} ${f1(-r)}L${f1(r*.17)} 0Z`,
  patteeC:(r)=>`M${f1(-r*.17)} 0L${f1(-r*.48)} ${f1(-r*.92)}Q0 ${f1(-r*1.06)} ${f1(r*.48)} ${f1(-r*.92)}L${f1(r*.17)} 0Z`,
  urdy:(r)=>`M${f1(-r*.2)} 0L${f1(-r*.2)} ${f1(-r*.72)}L0 ${f1(-r)}L${f1(r*.2)} ${f1(-r*.72)}L${f1(r*.2)} 0Z`,
  trefoil:(r)=>`M${f1(-r*.2)} 0L${f1(-r*.2)} ${f1(-r*.6)}A${f1(r*.17)} ${f1(r*.17)} 0 1 1 ${f1(-r*.12)} ${f1(-r*.88)}A${f1(r*.17)} ${f1(r*.17)} 0 1 1 ${f1(r*.12)} ${f1(-r*.88)}A${f1(r*.17)} ${f1(r*.17)} 0 1 1 ${f1(r*.2)} ${f1(-r*.6)}L${f1(r*.2)} 0Z`,
  fleur:(r)=>`M${f1(-r*.18)} 0L${f1(-r*.3)} ${f1(-r*.62)}C${f1(-r*.52)} ${f1(-r*.62)} ${f1(-r*.5)} ${f1(-r*.9)} ${f1(-r*.3)} ${f1(-r*.84)}C${f1(-r*.22)} ${f1(-r*.84)} ${f1(-r*.12)} ${f1(-r*.88)} 0 ${f1(-r)}C${f1(r*.12)} ${f1(-r*.88)} ${f1(r*.22)} ${f1(-r*.84)} ${f1(r*.3)} ${f1(-r*.84)}C${f1(r*.5)} ${f1(-r*.9)} ${f1(r*.52)} ${f1(-r*.62)} ${f1(r*.3)} ${f1(-r*.62)}L${f1(r*.18)} 0Z`,
  cleft:(r)=>`M${f1(-r*.12)} 0L${f1(-r*.34)} ${f1(-r*.94)}L0 ${f1(-r*.72)}L${f1(r*.34)} ${f1(-r*.94)}L${f1(r*.12)} 0Z`
};
function cross(cx,cy,type,r,fill,edge,n,inner){
  n = n||4;
  const rots = Array.from({length:n},(_,i)=>i*360/n);
  const arm = a=>`<path d="${ARM[type](r)}" transform="translate(${cx} ${cy}) rotate(${a})"`;
  let s = rots.map(a=>arm(a)+` fill="none" stroke="${edge}" stroke-width="2.6" stroke-linejoin="round"/>`).join("")
        + rots.map(a=>arm(a)+` fill="${fill}"/>`).join("");
  if(inner) s += rots.map(a=>`<path d="${ARM[type](r*.84)}" transform="translate(${cx} ${cy}) rotate(${a})" fill="${inner}"/>`).join("");
  else s += rots.map(a=>`<path d="${ARM[type](r*.8)}" transform="translate(${cx} ${cy}) rotate(${a})" fill="none" stroke="rgba(255,255,255,.3)" stroke-width=".7"/>`).join("");
  return s;
}
function swords(cx,cy,r){   // dos espadas cruzadas con la punta hacia arriba, asomando entre los brazos
  const L = r*1.02, s = Math.SQRT1_2;
  let o = "";
  [[-1,1],[1,1]].forEach(([sx])=>{
    const x1 = cx - sx*L*s, y1 = cy + L*s, x2 = cx + sx*L*s, y2 = cy - L*s;
    o += `<path d="M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}" stroke="#4a3610" stroke-width="3.4" stroke-linecap="round"/><path d="M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}" stroke="url(#mSilver)" stroke-width="2" stroke-linecap="round"/>`;
    const gx = cx - sx*L*s*.62, gy = cy + L*s*.62;
    o += `<path d="M${f1(gx-4*s)} ${f1(gy-4*s*sx*-1)}L${f1(gx+4*s)} ${f1(gy+4*s*sx*-1)}" stroke="url(#mGold)" stroke-width="2.2" stroke-linecap="round"/>`;
  });
  return o;
}
function crownSVG(cx,y,w,fill){   // corona de suspensión
  const h = w*.72;
  return `<path d="M${f1(cx-w/2)} ${f1(y+h)}L${f1(cx-w/2-1)} ${f1(y+h*.35)}L${f1(cx-w*.25)} ${f1(y+h*.6)}L${f1(cx)} ${f1(y+h*.15)}L${f1(cx+w*.25)} ${f1(y+h*.6)}L${f1(cx+w/2+1)} ${f1(y+h*.35)}L${f1(cx+w/2)} ${f1(y+h)}Z" fill="${fill}" stroke="#4a3610" stroke-width=".7"/>`
    + `<rect x="${f1(cx-w/2)}" y="${f1(y+h-1)}" width="${f1(w)}" height="3" rx=".8" fill="${fill}" stroke="#4a3610" stroke-width=".6"/>`
    + `<circle cx="${cx}" cy="${f1(y+h*.08)}" r="1.6" fill="${fill}" stroke="#4a3610" stroke-width=".5"/>`
    + [-w*.25,0,w*.25].map(dx=>`<circle cx="${f1(cx+dx)}" cy="${f1(y+h+.5)}" r=".8" fill="#b3202c"/>`).join("");
}
function ringSusp(y1,y2,metal){  // anilla entre la cinta y la medalla
  return `<rect x="47" y="${y1}" width="6" height="5" rx="1.5" fill="${metal}" stroke="#4a3610" stroke-width=".5"/><circle cx="50" cy="${f1((y1+5+y2)/2)}" r="${f1((y2-y1-5)/2)}" fill="none" stroke="#4a3610" stroke-width="2.6"/><circle cx="50" cy="${f1((y1+5+y2)/2)}" r="${f1((y2-y1-5)/2)}" fill="none" stroke="${metal}" stroke-width="1.6"/>`;
}
function wreath(cx,cy,rx,ry,col,berry){  // corona vegetal de suspensión
  let s = "";
  for(let i=0;i<14;i++){
    const a = Math.PI*(.15 + .7*i/13) * (i%2?1:1), side = i<7 ? -1 : 1, t = (i%7)/6;
    const ang = Math.PI*(1 - t*.92);
    const x = cx + side*rx*Math.cos(ang)*-1, y = cy + ry*Math.sin(ang)*-.9 + ry*.25;
    s += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="2.6" ry="1.3" transform="rotate(${f1(side*(30+t*60))} ${f1(x)} ${f1(y)})" fill="${col}" stroke="rgba(0,0,0,.35)" stroke-width=".3"/>`;
  }
  if(berry) s += `<circle cx="${cx}" cy="${f1(cy+ry*.9)}" r="1.4" fill="${berry}"/>`;
  return s;
}
function lion(cx,cy,s,col){  // león rampante esquemático
  return `<path transform="translate(${cx} ${cy}) scale(${s})" fill="${col}" d="M-2 5L-2.6 2L-4 1.4L-3 -.6L-1.4 -.4L-.6 -2.6L-1.6 -4L.2 -4.6L1.6 -3.4L1.2 -1.6L2.6 -1L1.8 .6L3 1.6L3.6 4.2L2.2 3.2L1.4 4.8L.4 2.6L-.6 5Z"/>`;
}
function arcText(k,cx,cy,r,txt,size,col,top){

}

function medalSVG(k){
  const m = MEDALS[k], total = m.rib.reduce((a,r)=>a+r[1],0), x0 = 28, W = 44;

  const sword = m.ribSword ? `<path d="M41 29H58" stroke="#4a2c12" stroke-width="2.6" stroke-linecap="round"/><path d="M41 29H58" stroke="url(#mBronze)" stroke-width="1.4" stroke-linecap="round"/><path d="M44 26.4V31.6" stroke="url(#mBronze)" stroke-width="1.6" stroke-linecap="round"/>` : "";
  return `<svg viewBox="0 0 100 172" aria-hidden="true">`
    + rib + `<rect x="28" y="6" width="44" height="46" fill="url(#ribShade)"/>`
    + `<rect x="28" y="6" width="44" height="46" fill="url(#ribMoire)" opacity=".35"/>`
    + sword
    + `<rect x="25" y="2" width="50" height="6" rx="1.5" fill="url(#mGold)" stroke="#5a4110" stroke-width=".6"/>`
    + m.draw(k) + `</svg>`;
}
const dlcTotal = k => ACH.filter(a=>a.k===k).length;
const dlcDone = k => ACH.filter(a=>a.k===k && done.has(a.t)).length;
const isComplete = k => dlcDone(k) === dlcTotal(k);
function renderMedals(){
  const box = $("#slots"); if(!box) return;
  box.textContent = "";
  let won = 0;
  ORDER.forEach(k=>{
    const ok = isComplete(k); if(ok) won++;
    const d = document.createElement("div");
    d.className = "slot" + (ok ? " won" : "");
    d.title = MEDALS[k][lang] + " · " + dlcName(k);
    d.innerHTML = medalSVG(k);
    const n = document.createElement("span"); n.className = "sl-name"; n.textContent = dlcName(k);
    const p = document.createElement("span"); p.className = "sl-prog"; p.textContent = ok ? MEDALS[k][lang] : `${dlcDone(k)} / ${dlcTotal(k)}`;
    d.append(n,p); box.appendChild(d);
  });
  $("#medalCount").textContent = tr().medalCount(won, ORDER.length);
}
let toastTimer = null;
function showToast(text){
  const t = $("#toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.remove("show"), 4200);
}
function toggleDone(title){
  const a = ACH.find(x=>x.t===title), before = a && isComplete(a.k), nowDone = !done.has(title);
  if(nowDone) done.add(title); else done.delete(title);
  saveDone(); refresh();
  if(nowDone){ SND.stamp(); SND.scratch(.34); revealInNotebook(title); } else SND.unmark();
  if(a && !before && isComplete(a.k)){ showToast(tr().toast(MEDALS[a.k][lang], dlcName(a.k))); SND.medal(.85); }
}
/* Lleva el cuaderno hasta el logro y anima el tachado */
function revealInNotebook(title){
  const list = $("#list"), li = [...list.children].find(el=>el.dataset && el.dataset.t===title);
  if(!li) return;
  const lr = list.getBoundingClientRect(), r = li.getBoundingClientRect();
  const top = list.scrollTop + (r.top - lr.top) - (list.clientHeight - r.height)/2;
  list.scrollTop = Math.max(0, top);
  li.classList.add("strike-anim");
}
function refresh(){
  rebuildPool(); draw();
  if(!spinning){ if(current) setReadout(current,"result"); else setReadout(null); }
  showResult(); updateSpinBtn(); renderMeta(); renderChips(); renderList(); renderMedals();
}

/* ---------- Chapa ---------- */
function renderMeta(){
  $("#tally").textContent = tr().tally(done.size, TOTAL);
  $("#tagLabel").textContent = tr().tagLabel;
  $("#tagCount").textContent = `${pad3(done.size)} / ${TOTAL}`;
  $("#tagPct").textContent = (done.size/TOTAL*100).toFixed(1).replace(".", tr().dec) + " %";
  $("#pool").textContent = pool.length ? tr().pool(pool.length) : tr().empty;
}

/* ---------- DLC ---------- */
function renderChips(){
  const box = $("#chips"); box.textContent = "";
  ORDER.forEach(k=>{
    const left = ACH.filter(a=>a.k===k && !done.has(a.t)).length;
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", enabled.has(k) ? "true" : "false");
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = DLC[k].c;
    const nm = document.createElement("span"); nm.textContent = dlcName(k);
    const ct = document.createElement("small"); ct.textContent = left;
    b.append(sw,nm,ct);
    b.addEventListener("click",()=>{ SND.click(); if(enabled.has(k)) enabled.delete(k); else enabled.add(k); saveDlc(); refresh(); });
    box.appendChild(b);
  });
  $("#dlcSummary").textContent = tr().dlcs(enabled.size, ORDER.length);
}

/* ---------- Cuaderno ---------- */
const q = $("#q"), fStatus = $("#fStatus"), fDlc = $("#fDlc");
function fillSelects(){
  const sv = fStatus.value || "all", dv = fDlc.value || "all";
  fStatus.innerHTML = "";
  [["all",tr().stAll],["pending",tr().stPending],["done",tr().stDone]].forEach(([v,l])=> fStatus.add(new Option(l,v)));
  fStatus.value = sv;
  fDlc.innerHTML = ""; fDlc.add(new Option(tr().dlcAll,"all"));
  ORDER.forEach(k=> fDlc.add(new Option(dlcName(k),k)));
  fDlc.value = dv;
  q.placeholder = tr().search;
  q.setAttribute("aria-label", tr().search);
  fStatus.setAttribute("aria-label", tr().stAll);
  fDlc.setAttribute("aria-label", tr().dlcAll);
}
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/’/g,"'");
function renderList(){
  const list = $("#list"), keep = list.scrollTop;
  list.textContent = "";
  const term = norm(q.value.trim()), st = fStatus.value, dk = fDlc.value;
  const items = ACH.filter(a=>{
    if(dk!=="all" && a.k!==dk) return false;
    const d = done.has(a.t);
    if(st==="pending" && d) return false;
    if(st==="done" && !d) return false;
    if(term && !norm(a.t+" "+desc(a)+" "+dlcName(a.k)).includes(term)) return false;
    return true;
  });
  $("#count").textContent = tr().count(items.length);
  if(!items.length){ const li = document.createElement("li"); li.className = "empty"; li.textContent = tr().nothing; list.appendChild(li); return; }
  const frag = document.createDocumentFragment();
  items.forEach(a=>{
    const li = document.createElement("li"); li.dataset.t = a.t;
    if(done.has(a.t)) li.className = "is-done";
    const lab = document.createElement("label");
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.className = "chk"; cb.checked = done.has(a.t);
    cb.addEventListener("change",()=> toggleDone(a.t));
    const ti = document.createElement("span"); ti.className = "li-title"; const tt = document.createElement("span"); tt.className = "tt"; tt.textContent = a.t; ti.appendChild(tt);
    const me = document.createElement("span"); me.className = "li-meta";
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = DLC[a.k].c;
    const dn = document.createElement("span"); dn.textContent = dlcName(a.k);
    me.append(sw,dn);
    const de = document.createElement("span"); de.className = "li-desc"; de.textContent = desc(a);
    lab.append(cb,ti,me,de);
    li.appendChild(lab); frag.appendChild(li);
  });
  list.appendChild(frag);
  list.scrollTop = keep;
}

  document.querySelectorAll("[data-i18n]").forEach(el=>{ const v = tr()[el.dataset.i18n]; if(typeof v==="string") el.textContent = v; });

/* ---------- Exportar / importar progreso con un código ---------- */
const CODE_PREFIX = "HOI4R1-";
function b64url(bytes){ let s = ""; bytes.forEach(b=> s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64url(str){ const s = str.replace(/-/g,"+").replace(/_/g,"/"); const bin = atob(s + "===".slice((s.length+3)%4)); return Uint8Array.from(bin, c=>c.charCodeAt(0)); }
function makeCode(){
  const nA = ACH.length, nD = ORDER.length, bytes = new Uint8Array(Math.ceil(nA/8) + Math.ceil(nD/8));
  ACH.forEach((a,i)=>{ if(done.has(a.t)) bytes[i>>3] |= 1 << (i&7); });
  const off = Math.ceil(nA/8);
  ORDER.forEach((k,i)=>{ if(enabled.has(k)) bytes[off + (i>>3)] |= 1 << (i&7); });
  return CODE_PREFIX + b64url(bytes);
}
function readCode(code){
  code = (code||"").trim().replace(/\s+/g,"");
  if(!code.startsWith(CODE_PREFIX)) return null;
  let bytes; try{ bytes = unb64url(code.slice(CODE_PREFIX.length)); }catch(e){ return null; }
  const nA = ACH.length, nD = ORDER.length, off = Math.ceil(nA/8);
  if(bytes.length !== off + Math.ceil(nD/8)) return null;
  const d = new Set(), en = new Set();
  ACH.forEach((a,i)=>{ if(bytes[i>>3] & (1 << (i&7))) d.add(a.t); });
  ORDER.forEach((k,i)=>{ if(bytes[off + (i>>3)] & (1 << (i&7))) en.add(k); });
  return {done:d, enabled:en};
}
const modal = $("#codeModal"), codeText = $("#codeText"), codeMsg = $("#codeMsg"), codeOk = $("#codeOk");
let modalMode = "export", modalOpener = null;
function setMsg(t, bad){ codeMsg.textContent = t || ""; codeMsg.classList.toggle("bad", !!bad); }
function openModal(mode, opener){
  modalMode = mode; modalOpener = opener || null; setMsg("");
  $("#codeTitle").textContent = mode==="export" ? tr().exTitle : tr().imTitle;
  $("#codeHelp").textContent = mode==="export" ? tr().exHelp : tr().imHelp;
  codeOk.textContent = mode==="export" ? tr().copy : tr().load;
  $("#codeClose").textContent = tr().close;
  codeText.value = mode==="export" ? makeCode() : "";
  codeText.readOnly = mode==="export";
  modal.hidden = false; SND.click();
  codeText.focus(); if(mode==="export") codeText.select();
}
function closeModal(){ modal.hidden = true; if(modalOpener) modalOpener.focus(); }
async function copyCode(){
  codeText.focus(); codeText.select();
  try{ await navigator.clipboard.writeText(codeText.value); setMsg(tr().copied); return; }catch(e){}
  try{ if(document.execCommand("copy")){ setMsg(tr().copied); return; } }catch(e){}
  setMsg(tr().copyFail, true);
}
function loadCode(){
  const r = readCode(codeText.value);
  if(!r){ setMsg(tr().badCode, true); return; }
  done = r.done; enabled = r.enabled; saveDone(); saveDlc(); current = null;
  refresh(); closeModal(); showToast(tr().loaded(done.size)); SND.stamp();
}
$("#exportBtn").addEventListener("click", e=> openModal("export", e.currentTarget));
$("#importBtn").addEventListener("click", e=> openModal("import", e.currentTarget));
codeOk.addEventListener("click", ()=> modalMode==="export" ? copyCode() : loadCode());
$("#codeClose").addEventListener("click", closeModal);
modal.addEventListener("click", e=>{ if(e.target === modal) closeModal(); });
document.addEventListener("keydown", e=>{
  if(modal.hidden) return;
  if(e.key === "Escape"){ e.preventDefault(); closeModal(); }
  if(e.key === "Enter" && modalMode === "import" && !e.shiftKey){ e.preventDefault(); loadCode(); }
  if(e.key === "Tab"){ const f = [...modal.querySelectorAll("textarea,button")]; const i = f.indexOf(document.activeElement);
    if(e.shiftKey && i<=0){ e.preventDefault(); f[f.length-1].focus(); } else if(!e.shiftKey && i===f.length-1){ e.preventDefault(); f[0].focus(); } }
});

/* ---------- Cadena de bolitas: placa → agujero de la chapa → placa ---------- */
const chainBack = $("#chainBack"), chainFront = $("#chainFront");
const bez = (p0,c,p1,t)=>({x:(1-t)*(1-t)*p0.x+2*(1-t)*t*c.x+t*t*p1.x, y:(1-t)*(1-t)*p0.y+2*(1-t)*t*c.y+t*t*p1.y});
function ctrl(p0,p1,sag,side){
  const d = Math.hypot(p1.x-p0.x, p1.y-p0.y);
  return {x:(p0.x+p1.x)/2 + side*d, y:(p0.y+p1.y)/2 + sag*d};
}
function beads(p0,c,p1,step){
  const pts = [p0]; let prev = p0, acc = 0;
  for(let i=1;i<=600;i++){
    const p = bez(p0,c,p1,i/600);
    acc += Math.hypot(p.x-prev.x, p.y-prev.y); prev = p;
    if(acc >= step){ pts.push(p); acc = 0; }
  }
  return pts;
}
const bez3 = (p0,c1,c2,p1,t)=>{ const u = 1-t; return {x:u*u*u*p0.x + 3*u*u*t*c1.x + 3*u*t*t*c2.x + t*t*t*p1.x, y:u*u*u*p0.y + 3*u*u*t*c1.y + 3*u*t*t*c2.y + t*t*t*p1.y}; };
function beads3(p0,c1,c2,p1,step){
  const pts = [p0]; let prev = p0, acc = 0;
  for(let i=1;i<=900;i++){
    const p = bez3(p0,c1,c2,p1,i/900);
    acc += Math.hypot(p.x-prev.x, p.y-prev.y); prev = p;
    if(acc >= step){ pts.push(p); acc = 0; }
  }
  return pts;
}
function strand(segs, id){
  let s = `<defs><radialGradient id="${id}" cx="35%" cy="32%" r="70%"><stop offset="0" stop-color="#f6f6f0"/><stop offset=".45" stop-color="#a8a9a1"/><stop offset="1" stop-color="#45463f"/></radialGradient></defs>`;
  segs.forEach(pts=>{
    const line = pts.map(p=>p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
    const sh = pts.map(p=>(p.x+2).toFixed(1)+","+(p.y+3).toFixed(1)).join(" ");
    s += `<polyline points="${sh}" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
    s += `<polyline points="${line}" fill="none" stroke="#6a6b65" stroke-width="1.2"/>`;
    pts.forEach(p=>{ s += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.8" fill="url(#${id})"/>`; });
  });
  return s;
}
/* Spline Catmull-Rom centrípeta: curva suave que pasa por todos los puntos, sin quiebros */
function spline(pts, n){
  const out = [];
  const P = [pts[0], ...pts, pts[pts.length-1]];
  for(let i=1;i<P.length-2;i++){
    const p0=P[i-1], p1=P[i], p2=P[i+1], p3=P[i+2];
    const d = (a,b)=> Math.pow(Math.hypot(b.x-a.x,b.y-a.y), .5) || 1e-4;
    const t0=0, t1=t0+d(p0,p1), t2=t1+d(p1,p2), t3=t2+d(p2,p3);
    for(let k=0;k<n;k++){
      const t = t1 + (t2-t1)*k/n;
      const L = (a,b,ta,tb)=>({x:(tb-t)/(tb-ta)*a.x+(t-ta)/(tb-ta)*b.x, y:(tb-t)/(tb-ta)*a.y+(t-ta)/(tb-ta)*b.y});
      const A1=L(p0,p1,t0,t1), A2=L(p1,p2,t1,t2), A3=L(p2,p3,t2,t3);
      const B1=L(A1,A2,t0,t2), B2=L(A2,A3,t1,t3);
      out.push(L(B1,B2,t1,t2));
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
function beadsAlong(pts, step){
  const res = [pts[0]]; let acc = 0;
  for(let i=1;i<pts.length;i++){
    let a = pts[i-1], b = pts[i], seg = Math.hypot(b.x-a.x,b.y-a.y);
    while(acc + seg >= step){
      const t = (step-acc)/seg; const p = {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t};
      res.push(p); a = p; seg = Math.hypot(b.x-a.x,b.y-a.y); acc = 0;
    }
    acc += seg;
  }
  return res;
}
let chainRaf = 0;
function drawChain(){
  cancelAnimationFrame(chainRaf);
  chainRaf = requestAnimationFrame(()=>{
    const plate = $(".plate"), hole = $(".dogtag .hole");
    if(!plate || !hole) return;
    const layers = [$("#chainUnder"), chainBack, chainFront];
    layers.forEach(s=>{ s.style.width = "0px"; s.style.height = "0px"; });
    const pr = plate.getBoundingClientRect(), hr = hole.getBoundingClientRect();
    const sx = window.scrollX, sy = window.scrollY;
    const H = {x:hr.left + sx, y:hr.top + sy};
    const W = document.documentElement.scrollWidth, Ht = document.documentElement.scrollHeight;
    layers.forEach(s=>{ s.setAttribute("width",W); s.setAttribute("height",Ht); s.style.width = W+"px"; s.style.height = Ht+"px"; });
    // Cadena suelta: pasa por el agujero de la chapa y sus dos tramos se curvan con holgura
    // hacia la esquina superior izquierda, por debajo de la placa del título.
    const L = pr.left + sx, Bt = pr.bottom + sy;
    const P = (x,y)=>({x,y});
    const hA = P(H.x-2, H.y+2), hB = P(H.x+2, H.y-2);
    // Cada tramo es una sola curva cúbica: cambia de dirección de forma continua, sin codos.
    const cubic = (p0,c1,c2,p1)=>{ const o=[]; for(let i=0;i<=240;i++) o.push(bez3(p0,c1,c2,p1,i/240)); return o; };
    // Tramo trasero: baja por detrás de la chapa, hace un vientre amplio a la izquierda y sube hasta salir por arriba
    const back = cubic(hA, P(H.x-14,H.y+100), P(L-112,H.y+78), P(L-104,-40));
    // Tramo delantero: sube desde el agujero, pasa bajo el extremo izquierdo de la placa y sale por arriba, separado del otro
    const front = cubic(hB, P(H.x-22,H.y-50), P(H.x+20,Bt+34), P(H.x+46,-40));
    layers[0].innerHTML = "";
    chainBack.innerHTML = strand([beadsAlong(back,7)], "bgB");
    chainFront.innerHTML = strand([beadsAlong(front,7)], "bgF");
  });
}
window.addEventListener("resize", drawChain);
if(window.ResizeObserver) new ResizeObserver(drawChain).observe(document.body);
if(document.fonts) document.fonts.ready.then(drawChain);
document.querySelectorAll(".lang button").forEach(b=> b.addEventListener("click", drawChain));

readTheme();
applyLang();
resize();
drawChain();
})();
